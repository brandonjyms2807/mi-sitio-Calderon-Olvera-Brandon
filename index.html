<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Supabase Auth & RLS</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="wrapper">
    <nav class="navbar">
      <a href="index.html" class="active">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="acerca.html">Acerca</a>
    </nav>

    <header class="header-box">
      <h1>Portal con Login y Supabase</h1>
      <p id="estado-sesion" class="status-badge">Verificando sesión...</p>
    </header>

    <!-- FORMULARIO DE LOGIN / REGISTRO -->
    <section id="auth-seccion" class="card">
      <h2>Iniciar sesión o registrarse</h2>
      <p class="card-subtitle">Accede con tu cuenta para administrar y registrar solicitudes.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="field">
          <label for="password">Contraseña (mín. 6 caracteres)</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="actions">
          <button type="submit" id="btn-login" class="btn-primary">Iniciar sesión</button>
          <button type="button" id="btn-registro" class="btn-secondary">Crear cuenta</button>
        </div>
      </form>
    </section>

    <!-- FORMULARIO DE SOLICITUDES (SOLO AL INICIAR SESIÓN) -->
    <section id="app-seccion" class="card" style="display: none;">
      <div class="card-top">
        <div>
          <h2>Nueva solicitud</h2>
          <p class="card-subtitle" style="margin-bottom: 0;">Los registros se guardan directamente en <code>public.solicitudes</code>.</p>
        </div>
        <button type="button" id="btn-logout" class="btn-ghost">Cerrar sesión</button>
      </div>

      <form id="solicitud-form">
        <div class="field">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" placeholder="Ej. Revisión de equipo" required>
        </div>

        <div class="field">
          <label for="detalle">Detalle</label>
          <textarea id="detalle" rows="3" placeholder="Describe la solicitud..." required></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">Guardar solicitud</button>
        </div>
      </form>

      <div class="solicitudes-header">
        <h3>Solicitudes guardadas</h3>
      </div>
      <ul id="lista-solicitudes" class="solicitudes-list"></ul>
    </section>

    <p id="mensaje" class="alert" role="status"></p>
  </div>

  <script type="module">
    import { supabase } from "./supabase-config.js";

    const estadoSesion = document.getElementById("estado-sesion");
    const authSeccion = document.getElementById("auth-seccion");
    const appSeccion = document.getElementById("app-seccion");
    const mensaje = document.getElementById("mensaje");

    const loginForm = document.getElementById("login-form");
    const btnRegistro = document.getElementById("btn-registro");
    const btnLogout = document.getElementById("btn-logout");
    const solicitudForm = document.getElementById("solicitud-form");
    const listaSolicitudes = document.getElementById("lista-solicitudes");

    function mostrarMensaje(texto, tipo = "info") {
      mensaje.textContent = texto;
      mensaje.className = texto ? `alert alert-${tipo}` : "alert";
    }

    function validarCredenciales(email, password) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !password) {
        mostrarMensaje("Completa correo y contraseña.", "error");
        return false;
      }
      if (!emailRegex.test(email)) {
        mostrarMensaje("El formato del correo no es válido.", "error");
        return false;
      }
      if (password.length < 6) {
        mostrarMensaje("La contraseña debe tener al menos 6 caracteres.", "error");
        return false;
      }
      return true;
    }

    async function cargarSolicitudes() {
      const { data, error } = await supabase
        .from("solicitudes")
        .select("id, titulo, detalle, usuario_email, creado_en")
        .order("id", { ascending: false });

      if (error) {
        mostrarMensaje("Error al leer solicitudes: " + error.message, "error");
        return;
      }

      listaSolicitudes.innerHTML = "";

      if (!data || data.length === 0) {
        const li = document.createElement("li");
        li.className = "empty-state";
        li.textContent = "Aún no hay solicitudes registradas.";
        listaSolicitudes.appendChild(li);
        return;
      }

      data.forEach((item) => {
        const li = document.createElement("li");
        li.className = "solicitud-item";

        const tituloEl = document.createElement("div");
        tituloEl.className = "solicitud-titulo";
        tituloEl.textContent = item.titulo;

        const detalleEl = document.createElement("div");
        detalleEl.className = "solicitud-detalle";
        detalleEl.textContent = item.detalle;

        const metaEl = document.createElement("div");
        metaEl.className = "solicitud-meta";
        const fecha = item.creado_en ? new Date(item.creado_en).toLocaleString("es-MX") : "";
        metaEl.textContent = `Por: ${item.usuario_email || "usuario"}${fecha ? " • " + fecha : ""}`;

        li.append(tituloEl, detalleEl, metaEl);
        listaSolicitudes.appendChild(li);
      });
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!validarCredenciales(email, password)) return;

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        mostrarMensaje("Error al iniciar sesión: " + error.message, "error");
      } else {
        mostrarMensaje("Sesión iniciada correctamente.", "info");
      }
    });

    btnRegistro.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!validarCredenciales(email, password)) return;

      const { error } = await supabase.auth.signUp({ email, password });
      if (error) {
        mostrarMensaje("Error al crear cuenta: " + error.message, "error");
      } else {
        mostrarMensaje("Cuenta creada e iniciada correctamente.", "info");
      }
    });

    btnLogout.addEventListener("click", async () => {
      await supabase.auth.signOut();
      mostrarMensaje("Sesión cerrada.", "info");
    });

    solicitudForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const titulo = document.getElementById("titulo").value.trim();
      const detalle = document.getElementById("detalle").value.trim();

      if (!titulo || !detalle) {
        mostrarMensaje("Escribe un título y un detalle.", "error");
        return;
      }

      const { data: { user } } = await supabase.auth.getUser();

      const { error } = await supabase
        .from("solicitudes")
        .insert([{
          titulo,
          detalle,
          usuario_email: user ? user.email : null
        }]);

      if (error) {
        mostrarMensaje("Error al guardar: " + error.message, "error");
      } else {
        solicitudForm.reset();
        mostrarMensaje("Solicitud guardada en Supabase.", "info");
        cargarSolicitudes();
      }
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      if (session && session.user) {
        estadoSesion.textContent = `Sesión iniciada como: ${session.user.email}`;
        authSeccion.style.display = "none";
        appSeccion.style.display = "block";
        cargarSolicitudes();
      } else {
        estadoSesion.textContent = "No has iniciado sesión.";
        authSeccion.style.display = "block";
        appSeccion.style.display = "none";
        listaSolicitudes.innerHTML = "";
      }
    });
  </script>
</body>
</html>
